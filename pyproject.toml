[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-telemetry-ai-analytics"
version = "0.1.0"
description = "Real-world Formula 1 telemetry and AI analytics platform"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "plotly",
    "pyyaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
